name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check backend tests src scripts

      - name: Pytest
        run: pytest -q

      - name: Dependency audit (runtime)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Dependency audit (dev, advisory)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docker:
              - backend/Dockerfile
              - backend/entrypoint.sh
              - requirements.txt
              - .dockerignore

      - name: Skip Docker (no relevant changes)
        if: steps.changes.outputs.docker != 'true'
        run: echo "No Docker-related paths changed; skipping image build."

      - name: Build API image
        if: steps.changes.outputs.docker == 'true'
        run: docker build -t arepa-api:ci -f backend/Dockerfile .

      - name: Smoke test /v1/health
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run -d --name arepa-ci -p 8000:8000 arepa-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/v1/health >/dev/null; then
              curl -sf http://localhost:8000/v1/health | tee health.json
              docker stop arepa-ci
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs arepa-ci
          docker stop arepa-ci || true
          exit 1
